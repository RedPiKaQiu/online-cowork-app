<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Online Cowork 协作看板预览</title>
  <desc id="desc">秋日市集筹备项目的双列任务看板，展示事项盒子和当前待办。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#254543" flood-opacity=".10"/></filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .muted { fill: #718085; } .title { fill: #263238; font-weight: 700; } .small { font-size: 13px; } .cardTitle { fill: #263238; font-size: 15px; font-weight: 700; } .cardText { fill: #718085; font-size: 12px; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#f7f8f5"/>
  <rect width="1200" height="78" fill="#ffffff"/>
  <path d="M0 78H1200" stroke="#e2e7e5"/>
  <g class="ui">
    <rect x="54" y="20" width="40" height="40" rx="13" fill="#398f8d"/>
    <path d="M66 33h16M66 41h16M66 49h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="108" y="38" class="title" font-size="17">秋日市集筹备</text>
    <text x="108" y="55" class="muted small">协调摊主、场地与活动物料</text>
    <rect x="250" y="28" width="47" height="22" rx="11" fill="#e5f2f1" stroke="#c9e4e2"/>
    <text x="262" y="43" fill="#287775" font-size="10" font-weight="700">DEMO</text>
    <rect x="1034" y="23" width="112" height="33" rx="10" fill="#fff" stroke="#e2e7e5"/>
    <text x="1051" y="44" class="title" font-size="13">成员管理</text>

    <g filter="url(#shadow)">
      <rect x="54" y="106" width="532" height="526" rx="18" fill="#eff2f0" stroke="#e2e7e5"/>
      <rect x="614" y="106" width="532" height="526" rx="18" fill="#eff2f0" stroke="#e2e7e5"/>
    </g>
    <g>
      <rect x="72" y="124" width="36" height="36" rx="10" fill="#8868a5"/>
      <path d="M84 135h12v14H84z" fill="none" stroke="#fff" stroke-width="2"/><path d="M87 132h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="120" y="143" class="title" font-size="16">事项盒子</text><text x="120" y="159" class="muted" font-size="12">稍后安排的想法与任务</text>
      <rect x="538" y="132" width="29" height="25" rx="12.5" fill="#fff"/><text x="549" y="149" class="muted" font-size="12" font-weight="700">3</text>
      <path d="M72 178H568" stroke="#d7dfdc"/>
    </g>
    <g>
      <rect x="632" y="124" width="36" height="36" rx="10" fill="#398f8d"/>
      <path d="M641 142l7 7 12-15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="680" y="143" class="title" font-size="16">当前待办</text><text x="680" y="159" class="muted" font-size="12">正在推进的工作</text>
      <rect x="1098" y="132" width="29" height="25" rx="12.5" fill="#fff"/><text x="1109" y="149" class="muted" font-size="12" font-weight="700">2</text>
      <path d="M632 178H1128" stroke="#d7dfdc"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="72" y="194" width="496" height="116" rx="14" fill="#fff" stroke="#e2e7e5"/>
      <rect x="72" y="326" width="496" height="116" rx="14" fill="#fff" stroke="#e2e7e5"/>
      <rect x="72" y="458" width="496" height="116" rx="14" fill="#fff" stroke="#e2e7e5"/>
      <rect x="632" y="194" width="496" height="116" rx="14" fill="#fff" stroke="#e2e7e5"/>
      <rect x="632" y="326" width="496" height="116" rx="14" fill="#fff" stroke="#e2e7e5"/>
    </g>
    <g>
      <rect x="72" y="210" width="4" height="80" rx="2" fill="#8868a5"/><text x="96" y="226" class="cardTitle">确认场地布置方案</text><text x="96" y="249" class="cardText">核对入口、摊位分区和雨天备选动线</text><circle cx="106" cy="278" r="12" fill="#e9b1a9"/><text x="100" y="282" fill="#fff" font-size="10" font-weight="700">林</text><text x="126" y="282" class="cardText">林夏</text><rect x="478" y="264" width="70" height="27" rx="8" fill="#f0f3f1"/><text x="490" y="282" fill="#287775" font-size="11" font-weight="700">开始处理</text>
      <rect x="72" y="342" width="4" height="80" rx="2" fill="#e7b466"/><text x="96" y="358" class="cardTitle">整理摊主报名信息</text><text x="96" y="381" class="cardText">补全品类、联系方式和用电需求</text><circle cx="106" cy="410" r="12" fill="#9cbad4"/><text x="100" y="414" fill="#fff" font-size="10" font-weight="700">周</text><text x="126" y="414" class="cardText">周宁</text>
      <rect x="72" y="474" width="4" height="80" rx="2" fill="#c7a4d9"/><text x="96" y="490" class="cardTitle">准备志愿者签到表</text><text x="96" y="513" class="cardText">整理班次与现场联络方式</text><text x="96" y="546" class="cardText">暂未分配</text>
      <rect x="632" y="210" width="4" height="80" rx="2" fill="#398f8d"/><text x="656" y="226" class="cardTitle">发布活动预热海报</text><text x="656" y="249" class="cardText">完成社群文案并同步到报名页面</text><circle cx="666" cy="278" r="12" fill="#9fc9b9"/><text x="660" y="282" fill="#fff" font-size="10" font-weight="700">陈</text><text x="686" y="282" class="cardText">陈默</text><rect x="1060" y="264" width="48" height="27" rx="8" fill="#398f8d"/><text x="1072" y="282" fill="#fff" font-size="11" font-weight="700">完成</text>
      <rect x="632" y="342" width="4" height="80" rx="2" fill="#58aaa7"/><text x="656" y="358" class="cardTitle">联系设备租赁商</text><text x="656" y="381" class="cardText">确认帐篷、音响和桌椅到场时间</text><circle cx="666" cy="410" r="12" fill="#e0b58f"/><text x="660" y="414" fill="#fff" font-size="10" font-weight="700">王</text><text x="686" y="414" class="cardText">王然</text>
    </g>
    <rect x="54" y="660" width="1092" height="55" rx="16" fill="#fff" stroke="#e2e7e5"/>
    <text x="77" y="694" class="muted" font-size="14">添加一项新任务…</text><rect x="1047" y="671" width="80" height="33" rx="10" fill="#398f8d"/><text x="1065" y="692" fill="#fff" font-size="13" font-weight="700">添加</text>
  </g>
</svg>
